[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "local-coding-agent"
version = "0.1.0"
description = "A fully stacked local AI coding agent supporting local (Ollama) and cloud models."
authors = [{ name = "PixelGuy Team" }]
readme = "ARCHITECTURE_PLAN.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.25.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "websockets>=11.0",
    "jinja2>=3.1.0"
]

[project.scripts]
coding-agent = "agent.main:app"
